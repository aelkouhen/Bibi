	<script>

	function getToken() {
	    var req = new XMLHttpRequest();
		req.open( "post", "/auth/oauth/token", false); // false for synchronous request
		req.setRequestHeader("Authorization", "Basic " + window.btoa("ADMIN_APP:admin"));

		var username = document.getElementById('username').value;
		var password = document.getElementById('password').value;
  		var resultElement = document.getElementById('result');
		var form = document.getElementById('form');

		var formData = new FormData();
		formData.append("grant_type", "password");
		formData.append("username", username);
		formData.append("password", password);

		req.send(formData);

		// Begin accessing JSON data here
		var responseObject = JSON.parse(req.response);
		if(req.status >= 200 && req.status < 400)
		{
			var token = responseObject['access_token'];
			var validity = responseObject['expires_in'];
			if(token){
				localStorage.setItem('access_token', token);
				/*
				Cookies.set('access_token', token,
						{
						path: '/', // available across the entire site
						expires: 1, //expires in 1 day
						httpOnly: true, //cookie not available through client js code
						secure: true // true to force https
						});
				*/
				redirectUrl("/content");
				return;
			}
		}

		const errorMessage = document.createElement('marquee');
		errorMessage.textContent = `Damn ! Couldn't reach Mima service!`;
		app.appendChild(errorMessage);
		//redirectUrl("/login");
	}

	function redirectUrl(url){
		location.href = url;
	}
	</script>
