spring:
  application:
    name: Bibi
  profiles: default

server:
  port: 8080

endpoints:
  restart:
    enabled: true
  shutdown:
    enabled: true
  health:
    sensitive: false

eureka:
  instance:
    hostname: localhost
    port: 8000
  client:
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${eureka.instance.port}/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 3000

zuul:
  sensitiveHeaders: Cookie,Set-Cookie
  ignoredServices: '*'
  routes:
    lyne:
      path: /api/**
      serviceId: lyne
      stripPrefix: false
    mima:
      path: /**
      serviceId: mima

security:
  oauth2:
    resource:
      token-type: Bearer
      client:
        client-id: CLIENT_APP
        client-secret: password
      id: CLIENT_RESOURCE
      jwt:
        key-value: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAzKOkPFC8hoRExHRtkXUK
          qI1jKU1T0Dr+ReoD6F76w2ZqcvFgqGOOUa+zmXiHCVRNGFVLpIkWYUaulY0r3Nf1
          9hRbISu/jn51D4cJcIgldlY99QT3oEH9w1M1y8WvFL8wufIaPcn8w05EVLrKtkfO
